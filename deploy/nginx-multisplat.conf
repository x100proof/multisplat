# Example nginx site for multisplat. Copy to /etc/nginx/sites-available/, link it into
# sites-enabled, replace the placeholders (example.com, <PROXY_IP>, the port if you changed it),
# then `sudo nginx -t && sudo systemctl reload nginx`.
#
# This file is included inside nginx's http {} block, so the zones below are defined there.

# Per-client rate limits. They key on $binary_remote_addr, so behind another proxy or CDN set up
# the realip lines in the server block, or every client shares one bucket.
limit_req_zone $binary_remote_addr zone=multisplat_ws:10m     rate=5r/s;   # WebSocket upgrades
limit_req_zone $binary_remote_addr zone=multisplat_report:10m rate=1r/s;   # debug reports
limit_req_zone $binary_remote_addr zone=multisplat_general:10m rate=20r/s; # everything else

map $http_upgrade $multisplat_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream multisplat {
    server 127.0.0.1:3008;   # the game's HOST:PORT (loopback only)
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    # Let your ACME client answer its challenge here, then send everyone to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # Another proxy or CDN in front of this one? Trust its address and take the client IP from it,
    # so the per-IP limits here (and X-Real-IP sent to the game) are the real client's.
    # set_real_ip_from <PROXY_IP>;
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;

    client_max_body_size 4k;
    limit_req_status 429;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Static files (served by the game process; it only serves public/ and shared/).
    location / {
        limit_req zone=multisplat_general burst=40 nodelay;
        limit_except GET HEAD { deny all; }
        proxy_pass http://multisplat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }

    # The game's WebSocket.
    location = /ws {
        limit_req zone=multisplat_ws burst=10 nodelay;
        proxy_pass http://multisplat;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $multisplat_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Player debug reports (SPEC §13): POST only, 16 KB max, 1 r/s per client.
    location = /debug/report {
        limit_req zone=multisplat_report burst=5 nodelay;
        limit_except POST { deny all; }
        client_max_body_size 16k;
        proxy_pass http://multisplat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }

    # There is deliberately no route to the admin listener (DEBUG_PORT). It stays on 127.0.0.1.
}
