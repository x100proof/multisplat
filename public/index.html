<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05030a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>multisplat</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #05030a; overflow: hidden;
               touch-action: none; user-select: none; -webkit-user-select: none;
               -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  body { color: #fff; font-family: ui-monospace, Menlo, Consolas, monospace; }
  /* #stage holds the game. On a phone held upright it is turned on its side (class rot, sized in
     resize()), so the game is always landscape, as in NinjaRunner. */
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage.rot { inset: auto; top: 0; transform-origin: 0 0; transform: rotate(90deg); }
  #wrap { position: relative; }
  canvas { display: block; }
  #hud { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between;
         padding: .4em .8em; font-weight: 700; font-size: clamp(11px, 2.2vw, 20px);
         color: #d1f7ff; text-shadow: 0 0 6px #05d9e8, 2px 2px 0 #000; pointer-events: none; }
  #hHp.low { color: #ff2a6d; text-shadow: 0 0 6px #ff2a6d, 2px 2px 0 #000; }
  #msg { position: absolute; left: 0; right: 0; top: 38%; text-align: center; pointer-events: none;
         font-weight: 800; font-size: clamp(16px, 4vw, 40px); color: #ff2a6d;
         text-shadow: 0 0 12px #ff2a6d, 0 0 28px #b026ff, 3px 3px 0 #000; }
  #help { position: absolute; left: 0; right: 0; bottom: .5em; text-align: center; pointer-events: none;
          font-size: clamp(9px, 1.6vw, 14px); color: rgba(209,247,255,.7); text-shadow: 1px 1px 0 #000; transition: opacity 1s; }
  #help.gone { opacity: 0; }

  #dbg { position: fixed; top: 10px; right: 10px; width: 280px; max-height: calc(100vh - 20px); overflow-y: auto;
         background: rgba(20, 14, 30, .6); border: 1px solid rgba(255,255,255,.25); border-radius: 8px;
         padding: 10px 12px; font-size: 12px; color: #eee; z-index: 10; backdrop-filter: blur(2px); }
  #dbg.hidden { display: none; }
  #dbg h2 { margin: 0 0 6px; font-size: 13px; color: #ffd84a; display: flex; justify-content: space-between; }
  #dbg h3 { margin: 10px 0 4px; font-size: 11px; color: #9ad8ff; text-transform: uppercase; letter-spacing: .05em; }
  #dbg label { display: grid; grid-template-columns: 1fr 44px; align-items: center; gap: 0 6px; margin: 2px 0; }
  #dbg label span.v { text-align: right; color: #fff; font-weight: 700; }
  #dbg input[type=range] { grid-column: 1 / -1; width: 100%; margin: 0 0 2px; accent-color: #6cc644; }
  #dbg label.chk { grid-template-columns: auto 1fr; }
  #dbg .info { color: #bbb; margin: 2px 0; }
  #dbg .stat { color: #f9f871; font-weight: 700; }
  #dbg .btns { display: flex; gap: 6px; margin-top: 10px; }
  #dbg button { flex: 1; font: inherit; color: #fff; background: rgba(255,255,255,.12);
                border: 1px solid rgba(255,255,255,.3); border-radius: 4px; padding: 4px; cursor: pointer; }
  #dbg button:hover { background: rgba(255,255,255,.22); }
</style>
</head>
<body>
<div id="stage">
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud"><span id="hHp"></span><span id="hScore"></span></div>
  <div id="msg"></div>
  <div id="help">← → move · ↑ / Z jump · Shift / X run · Space slash · D debug · M mute</div>
</div>
</div>
<div id="dbg" class="hidden"></div>
<script type="module" src="game.js"></script>
</body>
</html>
